<div class="card p-4 shadow">
  <h4>Order Report</h4>

  <div class="row g-3 mb-3">
    <div class="col-md-3">
      <label>Customer</label>
      <select [(ngModel)]="filters.customerId" class="form-select">
        <option value="">-- All --</option>
        <option *ngFor="let c of customers" [value]="c.customerId">{{ c.firstName }} {{ c.lastName }}</option>
      </select>
    </div>
    <div class="col-md-3">
      <label>Product</label>
      <select [(ngModel)]="filters.productId" class="form-select">
        <option value="">-- All --</option>
        <option *ngFor="let p of products" [value]="p.productId">{{ p.name }}</option>
      </select>
    </div>
    <div class="col-md-3">
      <label>From Date</label>
      <input [(ngModel)]="filters.fromDate" type="date" class="form-control" />
    </div>
    <div class="col-md-3">
      <label>To Date</label>
      <input [(ngModel)]="filters.toDate" type="date" class="form-control" />
    </div>
  </div>

<div class="mb-3">
  <button class="btn btn-primary me-2" (click)="search()">Search</button>
  <button class="btn btn-secondary me-2" (click)="clear()">Clear</button>
  <button class="btn btn-success me-2" (click)="exportToExcel()">📊 Export Excel</button>
  <button class="btn btn-danger" (click)="exportToPDF()">📄 Export PDF</button>
</div>

  <table class="table table-bordered table-striped mt-3" *ngIf="pagedReports.length > 0">
  <thead class="table-dark">
    <tr>
      <th (click)="sort('orderId')">Order ID</th>
      <th (click)="sort('customerName')">Customer</th>
      <th (click)="sort('productName')">Product</th>
      <th (click)="sort('quantity')">Qty</th>
      <th (click)="sort('unitPrice')">Price</th>
      <th (click)="sort('totalPrice')">Total</th>
      <th (click)="sort('orderDate')">Date</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of pagedReports">
      <td>{{ item.orderId }}</td>
      <td>{{ item.customerName }}</td>
      <td>{{ item.productName }}</td>
      <td>{{ item.quantity }}</td>
      <td>{{ item.unitPrice | currency }}</td>
      <td>{{ item.totalPrice | currency }}</td>
      <td>{{ item.orderDate | date }}</td>
    </tr>
  </tbody>
</table>

<!-- Pagination Controls -->
<nav *ngIf="totalPages > 1">
  <ul class="pagination justify-content-end">
    <li class="page-item" [class.disabled]="currentPage === 1">
      <button class="page-link" (click)="changePage(currentPage - 1)">Previous</button>
    </li>

    <li class="page-item" *ngFor="let p of [].constructor(totalPages); let i = index"
        [class.active]="currentPage === i + 1">
      <button class="page-link" (click)="changePage(i + 1)">{{ i + 1 }}</button>
    </li>

    <li class="page-item" [class.disabled]="currentPage === totalPages">
      <button class="page-link" (click)="changePage(currentPage + 1)">Next</button>
    </li>
  </ul>
</nav>

</div>
