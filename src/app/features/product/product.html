<div class="container mt-4">
    <h3>Product List</h3>

    <div *ngIf="loading">Loading products...</div>

    <table class="table table-bordered table-striped table-hover" *ngIf="!loading && products.length > 0">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Category ID</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let p of products">
                <td>{{ p.productId }}</td>
                <td>{{ p.name }}</td>
                <td>{{ p.description }}</td>
                <td>{{ p.price | currency }}</td>
                <td>{{ p.stockQuantity }}</td>
                <td>{{ p.categoryId }}</td>
            </tr>
        </tbody>
    </table>

    <div *ngIf="!loading && products.length === 0">
        No products found.
    </div>
</div>
