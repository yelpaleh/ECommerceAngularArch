<form #formProduct="ngForm" (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label>Name:</label>
    <input type="text" class="form-control" name="name" [(ngModel)]="formModel.name" required />
  </div>

  <div class="mb-3">
    <label>Description:</label>
    <textarea class="form-control" name="description" [(ngModel)]="formModel.description"></textarea>
  </div>

  <div class="mb-3">
    <label>Price:</label>
    <input type="number" class="form-control" name="price" [(ngModel)]="formModel.price" required min="0" />
  </div>

  <div class="mb-3">
    <label>Stock Quantity:</label>
    <input type="number" class="form-control" name="stockQuantity" [(ngModel)]="formModel.stockQuantity" required />
  </div>

  <div class="mb-3">
    <label>Category:</label>
    <select class="form-select" name="categoryId" [(ngModel)]="formModel.categoryId" required>
      <option value="">Select Category</option>
      <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
    </select>
  </div>

  <button class="btn btn-primary" type="submit" [disabled]="formProduct.invalid">
    {{ product?.productId ? 'Update' : 'Add' }} Product
  </button>
</form>
