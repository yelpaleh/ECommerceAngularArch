<h2>Add New Product</h2>
<form #f="ngForm" (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label>Name:</label>
    <input type="text" class="form-control" name="name" [(ngModel)]="product.name" required />
  </div>

  <div class="mb-3">
    <label>Description:</label>
    <textarea class="form-control" name="description" [(ngModel)]="product.description"></textarea>
  </div>

  <div class="mb-3">
    <label>Price:</label>
    <input type="number" class="form-control" name="price" [(ngModel)]="product.price" required min="0" />
  </div>

  <div class="mb-3">
    <label>Stock Quantity:</label>
    <input type="number" class="form-control" name="stockQuantity" [(ngModel)]="product.stockQuantity" required />
  </div>

  <div class="mb-3">
    <label>Category:</label>
    <select class="form-select" name="categoryId" [(ngModel)]="product.categoryId" required>
      <option value="">Select Category</option>
      <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
    </select>
  </div>

  <button class="btn btn-primary" type="submit" [disabled]="f.invalid">Add Product</button>
</form>
