<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">
  <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px;">
    <img src="/assets/logo.jpg" class="mx-auto d-block mb-3" height="50">
    <h3 class="text-center mb-4">🔐 Login</h3>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="mb-3">
        <label for="email" class="form-label">📧 Email</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          [(ngModel)]="email"
          required
        />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">🔒 Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          [(ngModel)]="password"
          required
        />
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger py-2">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">
        🔐 Login
      </button>
    </form>

    <p class="text-muted text-center mt-3 small">© 2025. All rights reserved.</p>
  </div>
</div>
